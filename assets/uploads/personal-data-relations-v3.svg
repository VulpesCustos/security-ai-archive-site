<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">개인정보·가명정보·민감정보·익명정보의 핵심 관계</title><desc id="desc">큰 개인정보 도형 안에서 가명정보 원과 민감정보 원이 일부 겹칩니다. 익명정보 원은 개인정보 도형 밖에 있습니다. 익명정보는 개인정보 보호법 제58조의2 요건을 충족할 때 이 법의 적용 대상에서 제외됩니다. 핵심 관계를 단순화했으며 전체 분류나 범주의 규모를 나타내지는 않습니다.</desc><g font-family="Malgun Gothic, Noto Sans KR, Apple SD Gothic Neo, sans-serif"><rect x="0" y="0" width="1200" height="740" rx="0" fill="#F7F9FC" stroke="none" stroke-width="1.5"/><text x="40" y="82" font-size="42" font-weight="700" fill="#182942">정보 유형의 관계</text><rect x="40" y="140" width="790" height="480" rx="36" fill="#EDF3FF" stroke="#92ABD8" stroke-width="3"/><text x="82" y="208" font-size="46" font-weight="700" fill="#234D9D">개인정보</text><circle cx="335" cy="410" r="156" fill="#EAE1FC" stroke="#9879C6" stroke-width="2.5"/><circle cx="535" cy="410" r="156" fill="#FCE4D2" stroke="#D19B74" stroke-width="2.5"/><path d="M 435.0 290.2669636232339 A 156 156 0 0 1 435.0 529.7330363767661 A 156 156 0 0 1 435.0 290.2669636232339 Z" fill="#D8BDDF"/><circle cx="335" cy="410" r="156" fill="none" stroke="#9879C6" stroke-width="2.5"/><circle cx="535" cy="410" r="156" fill="none" stroke="#D19B74" stroke-width="2.5"/><text x="196.0" y="425" font-size="42" font-weight="700" fill="#69479D">가명정보</text><text x="506.0" y="425" font-size="42" font-weight="700" fill="#955029">민감정보</text><text x="409.0" y="402" font-size="26" font-weight="700" fill="#5C426E">중첩</text><text x="409.0" y="437" font-size="26" font-weight="700" fill="#5C426E">가능</text><circle cx="1020" cy="364" r="132" fill="#EBEFF5" stroke="#9CAABE" stroke-width="2.5"/><text x="932.0" y="380" font-size="44" font-weight="700" fill="#46566B">익명정보</text><text x="917.0" y="550" font-size="28" font-weight="700" fill="#46566B">개인정보 보호법</text><text x="952.5" y="590" font-size="28" font-weight="700" fill="#46566B">적용 제외*</text><text x="40" y="688" font-size="25" font-weight="400" fill="#53647C">* 개인정보 보호법 제58조의2 요건 충족 시</text></g></svg>
