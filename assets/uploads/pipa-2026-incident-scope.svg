    <text x="44" y="164" font-size="42" font-weight="700" fill="#173e30">훼손된 사고까지 살핍니다</text>
    <text x="44" y="223" font-size="29" font-weight="700" fill="#51685c">기존 대상</text>
    <g fill="#fff" stroke="#dadfd8" stroke-width="2"><rect x="32" y="245" width="218" height="164" rx="20"/><rect x="271" y="245" width="218" height="164" rx="20"/><rect x="510" y="245" width="218" height="164" rx="20"/></g>
