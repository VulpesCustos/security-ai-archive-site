<svg xmlns="http://www.w3.org/2000/svg" width="420" height="390" viewBox="0 0 760 706" role="img" aria-labelledby="title desc">
  <title id="title">개인정보 사고 대응 범위 확대</title>
  <desc id="desc">기존 분실, 도난, 유출에 더해 위조, 변조, 훼손도 개인정보 사고 통지·신고 대상 범위에 포함됩니다. 개별 통지·신고 요건은 법령에 따릅니다.</desc>
  <rect width="760" height="706" rx="28" fill="#f6f5ed"/>
  <g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" transform="translate(0 -54)">
