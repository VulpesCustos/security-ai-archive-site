<svg xmlns="http://www.w3.org/2000/svg" width="640" height="2096" viewBox="0 0 640 2096" role="img" aria-labelledby="title desc"><title id="title">개인정보 관련 정보 유형의 개념과 분류</title><desc id="desc">개인정보 안에는 직접 알아볼 수 있는 정보, 다른 정보와 쉽게 결합해 알아볼 수 있는 정보, 가명정보가 포함됩니다. 민감정보와 고유식별정보는 개인정보의 내용과 식별번호에 따른 분류이며 가명정보도 민감정보를 포함할 수 있습니다. 익명정보는 법 제58조의2의 조건을 충족하면 개인정보 보호법 적용 대상에서 제외됩니다. PII, 잠재적 식별정보, 비식별 데이터셋은 국제표준과 기술문서에서 각각의 목적으로 정의한 용어입니다.</desc><g font-family="Malgun Gothic, Noto Sans KR, Apple SD Gothic Neo, sans-serif"><rect x="0" y="0" width="640" height="2096" rx="0" fill="#F7F9FC" stroke="none" stroke-width="1.5"/><text x="24" y="62" font-size="36" font-weight="700" fill="#182942">정보 유형의 분류 기준</text><text x="24" y="108" font-size="25" font-weight="400" fill="#53647C">범위 · 내용 · 처리 여부를 구분합니다</text><rect x="24" y="142" width="592" height="1010" rx="22" fill="#EEF3FF" stroke="#B7C9EC" stroke-width="1.5"/><text x="52" y="202" font-size="40" font-weight="700" fill="#234D9D">개인정보</text><text x="52" y="246" font-size="26" font-weight="400" fill="#234D9D">살아 있는 개인에 관한 정보</text><text x="52" y="294" font-size="25" font-weight="700" fill="#53647C">식별 가능성·처리 상태에 따른 유형</text><rect x="48" y="312" width="544" height="118" rx="16" fill="#FFFFFF" stroke="#CDDAF1" stroke-width="1.5"/><rect x="48" y="334" width="5" height="73" rx="2" fill="#234D9D" stroke="none" stroke-width="1.5"/><text x="70" y="359" font-size="29" font-weight="700" fill="#234D9D">직접 식별 가능한 정보</text><text x="70" y="402" font-size="24" font-weight="400" fill="#53647C">성명·영상 등으로 개인을 알아볼 수 있음</text><rect x="48" y="444" width="544" height="118" rx="16" fill="#FFFFFF" stroke="#CDDAF1" stroke-width="1.5"/><rect x="48" y="466" width="5" height="73" rx="2" fill="#234D9D" stroke="none" stroke-width="1.5"/><text x="70" y="491" font-size="29" font-weight="700" fill="#234D9D">쉽게 결합해 식별 가능한 정보</text><text x="70" y="534" font-size="24" font-weight="400" fill="#53647C">다른 정보와 쉽게 결합하여 개인을 식별</text><rect x="48" y="576" width="544" height="118" rx="16" fill="#F1ECFC" stroke="#C6B4E5" stroke-width="1.5"/><rect x="48" y="598" width="5" height="73" rx="2" fill="#6949A8" stroke="none" stroke-width="1.5"/><text x="70" y="623" font-size="29" font-weight="700" fill="#6949A8">가명정보</text><text x="70" y="666" font-size="24" font-weight="400" fill="#53647C">추가정보 없이는 특정 개인을 식별할 수 없음</text><rect x="48" y="724" width="544" height="1.5" rx="0" fill="#C5D2ED" stroke="none" stroke-width="1.5"/><text x="52" y="768" font-size="26" font-weight="700" fill="#53647C">내용·식별번호에 따른 추가 분류</text><rect x="48" y="788" width="544" height="118" rx="16" fill="#FFF3EB" stroke="#E7C5AF" stroke-width="1.5"/><text x="72" y="835" font-size="32" font-weight="700" fill="#9D4B21">민감정보</text><text x="72" y="875" font-size="24" font-weight="400" fill="#182942">건강·정치적 견해 등 법령상 보호 정보</text><rect x="48" y="922" width="544" height="142" rx="16" fill="#ECF7F9" stroke="#B0D7DF" stroke-width="1.5"/><text x="72" y="965" font-size="32" font-weight="700" fill="#126879">고유식별정보</text><text x="72" y="1006" font-size="25" font-weight="400" fill="#182942">주민등록번호·여권번호</text><text x="72" y="1042" font-size="25" font-weight="400" fill="#182942">운전면허번호·외국인등록번호</text><rect x="48" y="1082" width="544" height="48" rx="12" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="67" y="1115" font-size="25" font-weight="700" fill="#6949A8">가명정보와 민감정보는 겹칠 수 있음</text><rect x="24" y="1180" width="592" height="266" rx="22" fill="#EAF0F6" stroke="#CCD6E5" stroke-width="1.5"/><text x="52" y="1235" font-size="38" font-weight="700" fill="#182942">익명정보</text><text x="52" y="1279" font-size="24" font-weight="400" fill="#182942">시간·비용·기술 등을 합리적으로 고려할 때</text><text x="52" y="1320" font-size="26" font-weight="400" fill="#182942">다른 정보를 사용해도</text><text x="52" y="1358" font-size="26" font-weight="400" fill="#182942">더 이상 개인을 알아볼 수 없는 정보</text><text x="52" y="1411" font-size="24" font-weight="700" fill="#234D9D">개인정보 보호법 적용 제외 · 법 제58조의2</text><text x="24" y="1500" font-size="32" font-weight="700" fill="#182942">국제표준·기술문서의 용어</text><text x="24" y="1540" font-size="25" font-weight="400" fill="#53647C">국내법 분류와 일대일로 대응하지 않음</text><rect x="24" y="1568" width="592" height="132" rx="18" fill="#FFFFFF" stroke="#CCD6E5" stroke-width="1.5"/><text x="52" y="1598" font-size="19" font-weight="400" fill="#53647C">ISO/IEC 29100</text><text x="52" y="1640" font-size="32" font-weight="700" fill="#182942">개인식별정보(PII)</text><text x="52" y="1679" font-size="24" font-weight="400" fill="#53647C">개인과 연결되거나 연결될 수 있는 정보</text><rect x="24" y="1716" width="592" height="132" rx="18" fill="#FFFFFF" stroke="#CCD6E5" stroke-width="1.5"/><text x="52" y="1746" font-size="19" font-weight="400" fill="#53647C">NISTIR 8053</text><text x="52" y="1788" font-size="32" font-weight="700" fill="#182942">잠재적 식별정보</text><text x="52" y="1827" font-size="24" font-weight="400" fill="#53647C">특정 개인과 명확하게 연결될 수 있는 정보</text><rect x="24" y="1864" width="592" height="162" rx="18" fill="#FFFFFF" stroke="#CCD6E5" stroke-width="1.5"/><text x="52" y="1894" font-size="19" font-weight="400" fill="#53647C">ISO/IEC 20889</text><text x="52" y="1936" font-size="32" font-weight="700" fill="#182942">비식별 데이터셋</text><text x="52" y="1975" font-size="24" font-weight="400" fill="#53647C">비식별 처리의 결과</text><text x="52" y="2008" font-size="24" font-weight="400" fill="#53647C">익명성은 별도 판단</text></g></svg>
