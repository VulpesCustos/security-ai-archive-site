<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
  <title id="title">COBIT 5 목표 캐스케이드의 적용 예시</title>
  <desc id="desc">접근권한 관리를 예로 든 목표 연결입니다. 이해관계자의 요구인 고객정보 보호를 기업 목표인 고객 신뢰와 안정적인 서비스로 연결합니다. IT 관련 목표는 부적절한 정보 접근 위험을 줄이는 것이며, 실행 요소의 목표는 정해진 기준 안에 권한을 회수하고 완료 여부를 확인하는 것입니다. 설명을 위한 예시이며 공식 목표 명칭을 그대로 옮긴 것이 아닙니다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#547666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="900" height="450" rx="24" fill="#faf9f5"/>
  <g font-family="Pretendard, Malgun Gothic, sans-serif">
    <text x="30" y="57" fill="#124a34" font-size="32" font-weight="700">목표가 실무로 이어지는 흐름</text>
    <text x="30" y="95" fill="#52675d" font-size="22">접근권한 관리를 예로 든 목표 연결</text>
    <g stroke-width="1.5">
      <rect x="20" y="133" width="194" height="279" rx="18" fill="#124a34" stroke="#124a34"/>
      <rect x="242" y="133" width="194" height="279" rx="18" fill="#e7eeea" stroke="#bfd0c5"/>
      <rect x="464" y="133" width="194" height="279" rx="18" fill="#e8efef" stroke="#c4d4d1"/>
      <rect x="686" y="133" width="194" height="279" rx="18" fill="#f5eddf" stroke="#ddc8aa"/>
    </g>
    <g fill="none" stroke="#547666" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M217 276 H237"/><path d="M439 276 H459"/><path d="M661 276 H681"/>
    </g>
    <g text-anchor="middle" font-size="22" font-weight="700">
      <text x="117" y="177" fill="#d8e8dc">01</text><text x="339" y="177" fill="#446954">02</text><text x="561" y="177" fill="#426b66">03</text><text x="783" y="177" fill="#80501c">04</text>
    </g>
    <g text-anchor="middle" font-size="24" font-weight="700">
      <text x="117" y="220" fill="#ffffff">이해관계자의</text><text x="117" y="253" fill="#ffffff">요구</text>
      <text x="339" y="220" fill="#124a34">기업의</text><text x="339" y="253" fill="#124a34">목표</text>
      <text x="561" y="220" fill="#234e48">IT 관련</text><text x="561" y="253" fill="#234e48">목표</text>
      <text x="783" y="220" fill="#6d481e">실행 요소의</text><text x="783" y="253" fill="#6d481e">목표</text>
    </g>
    <g text-anchor="middle" font-size="21">
      <text x="117" y="310" fill="#f1f6f1">고객정보를</text><text x="117" y="343" fill="#f1f6f1">안전하게 보호</text>
      <text x="339" y="310" fill="#203f32">고객 신뢰와</text><text x="339" y="343" fill="#203f32">안정적인 서비스</text>
      <text x="561" y="310" fill="#203f39">부적절한 정보</text><text x="561" y="343" fill="#203f39">접근 위험 감소</text>
      <text x="783" y="310" fill="#49351d">정해진 기준 안에</text><text x="783" y="343" fill="#49351d">권한 회수</text><text x="783" y="376" fill="#49351d">완료 여부 확인</text>
    </g>
  </g>
</svg>
