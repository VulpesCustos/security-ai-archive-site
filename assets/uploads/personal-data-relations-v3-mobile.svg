<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1024" viewBox="0 0 640 1024" role="img" aria-labelledby="title desc"><title id="title">개인정보·가명정보·민감정보·익명정보의 핵심 관계</title><desc id="desc">큰 개인정보 도형 안에서 가명정보 원과 민감정보 원이 일부 겹칩니다. 익명정보 원은 개인정보 도형 밖에 있습니다. 익명정보는 개인정보 보호법 제58조의2 요건을 충족할 때 이 법의 적용 대상에서 제외됩니다. 핵심 관계를 단순화했으며 전체 분류나 범주의 규모를 나타내지는 않습니다.</desc><g font-family="Malgun Gothic, Noto Sans KR, Apple SD Gothic Neo, sans-serif"><rect x="0" y="0" width="640" height="1024" rx="0" fill="#F7F9FC" stroke="none" stroke-width="1.5"/><text x="24" y="66" font-size="36" font-weight="700" fill="#182942">정보 유형의 관계</text><rect x="24" y="118" width="592" height="510" rx="28" fill="#EDF3FF" stroke="#92ABD8" stroke-width="3"/><text x="54" y="184" font-size="42" font-weight="700" fill="#234D9D">개인정보</text><circle cx="220" cy="410" r="162" fill="#EAE1FC" stroke="#9879C6" stroke-width="2.5"/><circle cx="420" cy="410" r="162" fill="#FCE4D2" stroke="#D19B74" stroke-width="2.5"/><path d="M 320.0 282.5480482691614 A 162 162 0 0 1 320.0 537.4519517308386 A 162 162 0 0 1 320.0 282.5480482691614 Z" fill="#D8BDDF"/><circle cx="220" cy="410" r="162" fill="none" stroke="#9879C6" stroke-width="2.5"/><circle cx="420" cy="410" r="162" fill="none" stroke="#D19B74" stroke-width="2.5"/><text x="96.0" y="423" font-size="36" font-weight="700" fill="#69479D">가명정보</text><text x="400.0" y="423" font-size="36" font-weight="700" fill="#955029">민감정보</text><text x="294.0" y="401" font-size="26" font-weight="700" fill="#5C426E">중첩</text><text x="294.0" y="436" font-size="26" font-weight="700" fill="#5C426E">가능</text><circle cx="320" cy="800" r="130" fill="#EBEFF5" stroke="#9CAABE" stroke-width="2.5"/><text x="236.0" y="784" font-size="42" font-weight="700" fill="#46566B">익명정보</text><text x="231.75" y="832" font-size="24" font-weight="700" fill="#46566B">개인정보 보호법</text><text x="257.5" y="869" font-size="26" font-weight="700" fill="#46566B">적용 제외*</text><text x="153.25" y="994" font-size="26" font-weight="400" fill="#53647C">* 법 제58조의2 요건 충족 시</text></g></svg>
