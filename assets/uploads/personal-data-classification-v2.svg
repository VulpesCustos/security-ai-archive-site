<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1336" viewBox="0 0 1200 1336" role="img" aria-labelledby="title desc"><title id="title">개인정보 관련 정보 유형의 개념과 분류</title><desc id="desc">개인정보 안에는 직접 알아볼 수 있는 정보, 다른 정보와 쉽게 결합해 알아볼 수 있는 정보, 가명정보가 포함됩니다. 민감정보와 고유식별정보는 개인정보의 내용과 식별번호에 따른 분류이며 가명정보도 민감정보를 포함할 수 있습니다. 익명정보는 법 제58조의2의 조건을 충족하면 개인정보 보호법 적용 대상에서 제외됩니다. PII, 잠재적 식별정보, 비식별 데이터셋은 국제표준과 기술문서에서 각각의 목적으로 정의한 용어입니다.</desc><g font-family="Malgun Gothic, Noto Sans KR, Apple SD Gothic Neo, sans-serif"><rect x="0" y="0" width="1200" height="1336" rx="0" fill="#F7F9FC" stroke="none" stroke-width="1.5"/><text x="48" y="80" font-size="44" font-weight="700" fill="#182942">정보 유형의 분류 기준</text><text x="48" y="126" font-size="25" font-weight="400" fill="#53647C">정보의 범위 · 내용 · 처리 여부는 서로 다른 기준입니다.</text><rect x="48" y="168" width="1104" height="596" rx="24" fill="#EEF3FF" stroke="#B7C9EC" stroke-width="1.5"/><text x="80" y="226" font-size="40" font-weight="700" fill="#234D9D">개인정보</text><text x="776" y="223" font-size="21" font-weight="400" fill="#234D9D">국내법 · 개인정보 보호법 제2조</text><text x="80" y="268" font-size="25" font-weight="400" fill="#234D9D">살아 있는 개인에 관한 정보</text><rect x="80" y="294" width="1040" height="1.5" rx="0" fill="#C5D2ED" stroke="none" stroke-width="1.5"/><text x="80" y="332" font-size="24" font-weight="700" fill="#53647C">식별 가능성·처리 상태에 따른 유형</text><text x="672" y="332" font-size="24" font-weight="700" fill="#53647C">내용·식별번호에 따른 추가 분류</text><rect x="80" y="350" width="552" height="98" rx="15" fill="#FFFFFF" stroke="#CDDAF1" stroke-width="1.5"/><rect x="80" y="370" width="5" height="58" rx="2" fill="#234D9D" stroke="none" stroke-width="1.5"/><text x="104" y="390" font-size="28" font-weight="700" fill="#234D9D">직접 식별 가능한 정보</text><text x="104" y="426" font-size="22" font-weight="400" fill="#53647C">성명·영상 등으로 개인을 알아볼 수 있음</text><rect x="80" y="460" width="552" height="98" rx="15" fill="#FFFFFF" stroke="#CDDAF1" stroke-width="1.5"/><rect x="80" y="480" width="5" height="58" rx="2" fill="#234D9D" stroke="none" stroke-width="1.5"/><text x="104" y="500" font-size="28" font-weight="700" fill="#234D9D">쉽게 결합해 식별 가능한 정보</text><text x="104" y="536" font-size="22" font-weight="400" fill="#53647C">다른 정보와 쉽게 결합하여 개인을 알아볼 수 있음</text><rect x="80" y="570" width="552" height="98" rx="15" fill="#F1ECFC" stroke="#C6B4E5" stroke-width="1.5"/><rect x="80" y="590" width="5" height="58" rx="2" fill="#6949A8" stroke="none" stroke-width="1.5"/><text x="104" y="610" font-size="28" font-weight="700" fill="#6949A8">가명정보</text><text x="104" y="646" font-size="22" font-weight="400" fill="#53647C">추가정보 없이는 특정 개인을 알아볼 수 없음</text><rect x="672" y="350" width="448" height="136" rx="15" fill="#FFF3EB" stroke="#E7C5AF" stroke-width="1.5"/><text x="698" y="396" font-size="32" font-weight="700" fill="#9D4B21">민감정보</text><text x="698" y="437" font-size="24" font-weight="400" fill="#182942">건강·정치적 견해 등</text><text x="698" y="468" font-size="23" font-weight="400" fill="#53647C">법령이 별도로 보호하는 개인정보</text><rect x="672" y="502" width="448" height="166" rx="15" fill="#ECF7F9" stroke="#B0D7DF" stroke-width="1.5"/><text x="698" y="546" font-size="32" font-weight="700" fill="#126879">고유식별정보</text><text x="698" y="587" font-size="24" font-weight="400" fill="#182942">주민등록번호·여권번호</text><text x="698" y="624" font-size="24" font-weight="400" fill="#182942">운전면허번호·외국인등록번호</text><rect x="80" y="692" width="1040" height="47" rx="12" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="102" y="724" font-size="24" font-weight="700" fill="#6949A8">가명정보도 건강정보 등 민감정보를 포함할 수 있음</text><rect x="48" y="798" width="1104" height="154" rx="22" fill="#EAF0F6" stroke="#CCD6E5" stroke-width="1.5"/><text x="80" y="854" font-size="36" font-weight="700" fill="#182942">익명정보</text><text x="80" y="898" font-size="23" font-weight="400" fill="#53647C">법 제58조의2</text><text x="324" y="837" font-size="24" font-weight="400" fill="#182942">시간·비용·기술 등을 합리적으로 고려할 때</text><text x="324" y="875" font-size="24" font-weight="400" fill="#182942">다른 정보를 사용해도 더 이상 개인을 알아볼 수 없는 정보</text><text x="324" y="916" font-size="25" font-weight="700" fill="#234D9D">개인정보 보호법 적용 제외</text><text x="48" y="1014" font-size="32" font-weight="700" fill="#182942">국제표준·기술문서의 용어</text><rect x="48" y="1044" width="352" height="198" rx="18" fill="#FFFFFF" stroke="#CCD6E5" stroke-width="1.5"/><text x="72" y="1080" font-size="19" font-weight="400" fill="#53647C">ISO/IEC 29100</text><text x="72" y="1130" font-size="28" font-weight="700" fill="#182942">개인식별정보(PII)</text><text x="72" y="1173" font-size="23" font-weight="400" fill="#53647C">개인과 연결되거나</text><text x="72" y="1208" font-size="23" font-weight="400" fill="#53647C">연결될 수 있는 정보</text><rect x="424" y="1044" width="352" height="198" rx="18" fill="#FFFFFF" stroke="#CCD6E5" stroke-width="1.5"/><text x="448" y="1080" font-size="19" font-weight="400" fill="#53647C">NISTIR 8053</text><text x="448" y="1130" font-size="28" font-weight="700" fill="#182942">잠재적 식별정보</text><text x="448" y="1173" font-size="23" font-weight="400" fill="#53647C">특정 개인과 명확히</text><text x="448" y="1208" font-size="23" font-weight="400" fill="#53647C">연결될 수 있는 정보</text><rect x="800" y="1044" width="352" height="198" rx="18" fill="#FFFFFF" stroke="#CCD6E5" stroke-width="1.5"/><text x="824" y="1080" font-size="19" font-weight="400" fill="#53647C">ISO/IEC 20889</text><text x="824" y="1130" font-size="28" font-weight="700" fill="#182942">비식별 데이터셋</text><text x="824" y="1173" font-size="23" font-weight="400" fill="#53647C">비식별 처리의 결과</text><text x="824" y="1208" font-size="23" font-weight="400" fill="#53647C">익명성은 별도 판단</text><text x="48" y="1295" font-size="25" font-weight="400" fill="#53647C">국제 용어는 국내법의 분류와 일대일로 대응하지 않습니다.</text></g></svg>
