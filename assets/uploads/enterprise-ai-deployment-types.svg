<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1265" viewBox="0 0 1200 1265" role="img" aria-labelledby="title desc">
  <title id="title">기업 AI 도입의 네 가지 연결 구조</title>
  <desc id="desc">사내 관리 영역과 외부 영역을 점선으로 구분한 네 가지 대표 요청 경로입니다. 내부망 전용 AI는 직원, 사내 AI, 권한별 사내 자료로 연결되며 외부 연결은 없습니다. 사내 AI의 외부 연계는 허용 경로와 자료 검사 통제를 거칩니다. 고객용 AI는 고객별 인가를 확인하는 제한된 업무 API를 통해 내부 자료에 접근합니다. 상용 AI 사용은 정보 분류와 최소화를 거치며 보관 및 학습 조건을 확인해야 합니다. 응답 경로와 망 장비는 생략했습니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#087F8C" stroke-width="1.4"/></marker>
    <marker id="amber-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#B87916" stroke-width="1.4"/></marker>
  </defs>
  <rect width="1200" height="1265" fill="#FBFCFD"/>
  <g font-family="Pretendard, Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
