 y="412" font-size="26" font-weight="700" fill="#152C43" text-anchor="middle">사내 AI</text><text x="382" y="444" font-size="22" font-weight="400" fill="#607285" text-anchor="middle">반입·업데이트 검증</text><circle cx="646" cy="345" r="39" fill="#FFFFFF" stroke="#152C43" stroke-width="1.6"/><g transform="translate(626.0 325.0) scale(1.0)" fill="none" stroke="#152C43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="20" cy="8" rx="14" ry="5"/><path d="M6 8v24c0 3 6 5 14 5s14-2 14-5V8M6 20c0 3 6 5 14 5s14-2 14-5M6 30c0 3 6 5 14 5s14-2 14-5"/></g><text x="646" y="412" font-size="26" font-weight="700" fill="#152C43" text-anchor="middle">사내 자료</text><text x="646" y="444" font-size="22" font-weight="400" fill="#607285" text-anchor="middle">사용자별 권한 확인</text><path d="M211 345 L331 345" fill="none" stroke="#087F8C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M433 345 L595 345" fill="none" stroke="#087F8C" stroke-width="2.5" marker-end="url(#arrow)"/><g transform="translate(987.0 325.0) scale(1.0)" fill="none" stroke="#607285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 13 7-7m3 3 4-4m-5 15 4-4m-7-9 13 13M27 33l7-7m-3-3 4-4m-15 5 4-4m-11 6 13 13M5 35 35 5"/></g><text x="1007" y="412" font-size="26" font-weight="700" fill="#607285" text-anchor="middle">외부 연결 없음</text><text x="65" y="497" font-size="22" font-weight="700" fill="#087F8C" text-anchor="start">02</text><text x="112" y="497" font-size="28" font-weight="700" fill="#152C43" text-anchor="start">사내 AI의 외부망 연계</text><path d="M65 455 L814 455" fill="none" stroke="#D8E2E9" stroke-width="1.5"/><path d="M879 455 L1135 455" fill="none" stroke="#D8E2E9" stroke-width="1.5"/><circle cx="160" cy="565" r="39" fill="#FFFFFF" stroke="#152C43" stroke-width="1.6"/><g transform="translate(140.0 545.0) scale(1.0)" fill="none" stroke="#152C43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="11" r="6"/><path d="M7 36v-4a13 13 0 0 1 26 0v4M13 36v-6M27 36v-6"/></g><text x="160" y="632" font-size="26" font-weight="700" fill="#152C43" text-anchor="middle">직원</text><circle cx="382" cy="565" r="39" fill="#EDF7F7" stroke="#087F8C" stroke-width="1.6"/><g transform="translate(362.0 545.0) scale(1.0)" fill="none" stroke="#087F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="22" height="22" rx="5"/><path d="M15 2v7M25 2v7M15 31v7M25 31v7M2 15h7M2 25h7M31 15h7M31 25h7M16 24v-8h4v8M16 20h4M25 16v8"/></g><text x="382" y="632" font-size="26" font-weight="700" fill="#152C43" text-anchor="middle">사내 AI</text><circle cx="646" cy="565" r="39" fill="#FBF4E8" stroke="#B87916" stroke-width="1.6"/><g transform="translate(626.0 545.0) scale(1.0)" fill="none" stroke="#B87916" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 3 34 9v11c0 9-7 15-14 18C13 35 6 29 6 20V9Z"/><path d="m13 20 5 5 10-11"/></g><text x="646" y="632" font-size="26" font-weight="700" fill="#152C43" text-anchor="middle">연계 통제</text><text x="646" y="664" font-size="22" font-weight="400" fill="#607285" text-anchor="middle">허용 경로·자료 검사</text><circle cx="1007" cy="565" r="39" fill="#FFFFFF" stroke="#152C43" stroke-width="1.6"/><g transform="translate(987.0 545.0) scale(1.0)" fill="none" stroke="#152C43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="20" r="17"/><ellipse cx="20" cy="20" rx="7" ry="17"/><path d="M4 14h32M4 26h32"/></g><text x="1007" y="632" font-size="26" font-weight="700" fill="#152C43" text-anchor="middle">외부 웹·API</text><text x="1007" y="664" font-size="22" font-weight="400" fill="#607285" text-anchor="middle">검색·자료 수집</text><path d="M211 565 L331 565" fill="none" stroke="#087F8C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M433 565 L595 565" fill="none" stroke="#087F8C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M697 565 L956 565" fill="none" stroke="#087F8C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="65" y="717" font-size="22" font-weight="700" fill="#087F8C" text-anchor="start">03</text><text x="112" y="717" font-size="28" font-weight="700" fill="#152C43" text-anchor="start">고객서비스 AI의 사내망 연계</text><path d="M65 675 L814 675" fill="none" stroke="#D8E2E9" stroke-width="1.5"/><path d="M879 675 L1135 675" fill="none" stroke="#D8E2E9" stroke-width="1.5"/><circle cx="264" cy="785" r="39" fill="#FFFFFF" stroke="#152C43" stroke-width="1.6"/><g transform="translate(244.0 765.0) scale(1.0)" fill="none" stroke="#152C43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="20" cy="8" rx="14" ry="5"/><path d="M6 8v24c0 3 6 5 14 5s14-2 14-5V8M6 20c0 3 6 5 14 5s14-2 14-5M6 30c0 3 6 5 14 5s14-2 14-5"/></g><text x="264" y="852" font-size="26" font-weight="700" fill="#152C43" text-anchor="middle">고객·업무 자료</text><text x="264" y="884" font-size="22" font-weight="400" fill="#607285" text-anchor="middle">고객별 접근 제한</text><circle cx="646" cy="785" r="39" fill="#FBF4E8" stroke="#B87916" stroke-width="1.6"/><g transform="translate(626.0 765.0) scale(1.0)" fill="none" stroke="#B87916" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 3 34 9v11c0 9-7 15-14 18C13 35 6 29 6 20V9Z"/><path d="m13 20 5 5 10-11"/></g><text x="646" y="852" font-size="26" font-weight="700" fill="#152C43" text-anchor="middle">제한된 업무 API</text><text x="646" y="884" font-size="22" font-weight="400" fill="#607285" text-anchor="middle">서버에서 인가 검사</text><circle cx="1007" cy="785" r="39" fill="#EDF7F7" stroke="#087F8C" stroke-width="1.6"/><g transform="translate(987.0 765.0) scale(1.0)" fill="none" stroke="#087F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="22" height="22" rx="5"/><path d="M15 2v7M25 2v7M15 31v7M25 31v7M2 15h7M2 25h7M31 15h7M31 25h7M16 24v-8h4v8M16 20h4M25 16v8"/></g><text x="1007" y="852" font-size="26" font-weight="700" fill="#152C43" text-anchor="middle">고객용 AI</text><text x="1007" y="884" font-size="22" font-weight="400" fill="#607285" text-anchor="middle">고객 요청 접수</text><path d="M595 785 L315 785" fill="none" stroke="#087F8C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M956 785 L697 785" fill="none" stroke="#087F8C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="65" y="937" font-size="22" font-weight="700" fill="#087F8C" text-anchor="start">04</text><text x="112" y="937" font-size="28" font-weight="700" fill="#152C43" text-anchor="start">상용 AI 구독·API 활용</text><path d="M65 895 L814 895" fill="none" stroke="#D8E2E9" stroke-width="1.5"/><path d="M879 895 L1135 895" fill="none" stroke="#D8E2E9" stroke-width="1.5"/><circle cx="264" cy="1005" r="39" fill="#FFFFFF" stroke="#152C43" stroke-width="1.6"/><g transform="translate(244.0 985.0) scale(1.0)" fill="none" stroke="#152C43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="11" r="6"/><path d="M7 36v-4a13 13 0 0 1 26 0v4M13 36v-6M27 36v-6"/></g><text x="264" y="1072" font-size="26" font-weight="700" fill="#152C43" text-anchor="middle">직원·업무 앱</text><circle cx="646" cy="1005" r="39" fill="#FBF4E8" stroke="#B87916" stroke-width="1.6"/><g transform="translate(626.0 985.0) scale(1.0)" fill="none" stroke="#B87916" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 3 34 9v11c0 9-7 15-14 18C13 35 6 29 6 20V9Z"/><path d="m13 20 5 5 10-11"/></g><text x="646" y="1072" font-size="26" font-weight="700" fill="#152C43" text-anchor="middle">입력·전송 통제</text><text x="646" y="1104" font-size="22" font-weight="400" fill="#607285" text-anchor="middle">정보 분류·최소화</text><circle cx="1007" cy="1005" r="39" fill="#EDF7F7" stroke="#087F8C" stroke-width="1.6"/><g transform="translate(987.0 985.0) scale(1.0)" fill="none" stroke="#087F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 31a8 8 0 0 1-2-15 12 12 0 0 1 23-1 8 8 0 0 1 0 16Z"/><path d="m15 22 5-5 5 5M20 17v11"/></g><text x="1007" y="1072" font-size="26" font-weight="700" fill="#152C43" text-anchor="middle">상용 AI</text><text x="1007" y="1104" font-size="22" font-weight="400" fill="#607285" text-anchor="middle">보관·학습 조건 확인</text><path d="M315 1005 L595 1005" fill="none" stroke="#087F8C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M697 1005 L956 1005" fill="none" stroke="#087F8C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M48 1152 L1152 1152" fill="none" stroke="#D8E2E9" stroke-width="1.5"/><text x="48" y="1194" font-size="22" font-weight="400" fill="#607285" text-anchor="start">화살표는 대표 요청 방향입니다. 응답 경로와 망 장비는 생략했습니다.</text><text x="48" y="1230" font-size="22" font-weight="400" fill="#607285" text-anchor="start">기업에서는 여러 유형을 함께 사용할 수 있습니다.</text>
