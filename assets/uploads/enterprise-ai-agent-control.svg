<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1368" viewBox="0 0 1200 1368" role="img" aria-labelledby="title desc">
  <title id="title">AI 에이전트 실행과 모델 밖의 보안 통제</title>
  <desc id="desc">다섯 단계의 실행 흐름입니다. 요청과 외부 자료를 받은 AI 모델은 작업과 도구를 제안합니다. 모델 밖의 통제 시스템이 사용자, 대상, 도구와 실제 입력값의 권한을 검사하고 중요한 작업은 담당자가 승인합니다. 최소 권한과 한도 내에서 도구를 실행하며 실제 결과와 로그를 확인합니다. 취소 신호는 대기 작업 중단, 실행 자격 회수, 신규 호출 차단으로 처리하고 이미 실행된 변경에는 별도 복구 절차가 필요합니다. 모델의 승인 설명은 실제 승인을 대체하지 않습니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#087F8C" stroke-width="1.4"/></marker>
    <marker id="amber-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#B87916" stroke-width="1.4"/></marker>
  </defs>
  <rect width="1200" height="1368" fill="#FBFCFD"/>
  <g font-family="Pretendard, Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
    <rect x="48" y="46" width="45" height="5" rx="0" fill="#087F8C" stroke="none" stroke-width="1.5"/><text x="110" y="55" font-size="20" font-weight="700" fill="#087F8C" text-anchor="start" letter-spacing="0.5">실행 통제</text><text x="48" y="119" font-size="42" font-weight="700" fill="#152C43" text-anchor="start">AI의 작업 제안이 실제 실행으로 이어질 때</text><text x="48" y="162" font-size="24" font-weight="400" fill="#607285" text-anchor="start">모델의 판단과 시스템의 권한 검사를 분리합니다.</text><path d="M48 193 L1152 193" fill="none" stroke="#D8E2E9" stroke-width="1.5"/><text x="167" y="233" font-size="20" font-weight="700" fill="#087F8C" text-anchor="start">01</text><g transform="translate(84.0 257.0) scale(1.05)" fill="none" stroke="#152C43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h16l9 9v25H8Z M24 3v10h9M14 21h13M14 28h13"/></g><text x="167" y="276" font-size="30" font-weight="700" fill="#152C43" text-anchor="start">요청과 외부 자료</text><text x="167" y="317" font-size="24" font-weight="400" fill="#607285" text-anchor="start">사용자 요청 · 이메일 · 웹페이지 · 사내 문서</text><text x="167" y="352" font-size="23" font-weight="400" fill="#607285" text-anchor="start">외부 자료에 적힌 지시는 신뢰하지 않습니다.</text><path d="M105 314 L105 391" fill="none" stroke="#087F8C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="48" y="402" width="762" height="150" rx="8" fill="#EDF7F7" stroke="none" stroke-width="1.5"/><rect x="48" y="402" width="5" height="150" rx="0" fill="#087F8C" stroke="none" stroke-width="1.5"/><g transform="translate(84.0 441.0) scale(1.05)" fill="none" stroke="#087F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="22" height="22" rx="5"/><path d="M15 2v7M25 2v7M15 31v7M25 31v7M2 15h7M2 25h7M31 15h7M31 25h7M16 24v-8h4v8M16 20h4M25 16v8"/></g><text x="167" y="434" font-size="20" font-weight="700" fill="#087F8C" text-anchor="start">02  AI 모델</text><text x="167" y="477" font-size="30" font-weight="700" fill="#152C43" text-anchor="start">작업과 도구를 제안</text><text x="167" y="520" font-size="24" font-weight="400" fill="#607285" text-anchor="start">목표 분해 → 도구 선택 → 실제 입력값 제안</text><path d="M105 563 L105 627" fill="none" stroke="#087F8C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M48 590 L71 590" fill="none" stroke="#95A9B7" stroke-width="1.7" stroke-dasharray="5 7"/><path d="M139 590 L476 590" fill="none" stroke="#95A9B7" stroke-width="1.7" stroke-dasharray="5 7"/><path d="M787 590 L1152 590" fill="none" stroke="#95A9B7" stroke-width="1.7" stroke-dasharray="5 7"/><text x="630" y="598" font-size="24" font-weight="700" fill="#152C43" text-anchor="middle">모델 밖의 실행 통제</text><rect x="48" y="640" width="762" height="210" rx="8" fill="#152C43" stroke="none" stroke-width="1.5"/><g transform="translate(84.0 696.0) scale(1.05)" fill="none" stroke="#8BDEE0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 3 34 9v11c0 9-7 15-14 18C13 35 6 29 6 20V9Z"/><path d="m13 20 5 5 10-11"/></g><text x="167" y="678" font-size="20" font-weight="700" fill="#8BDEE0" text-anchor="start">03  독립된 통제 시스템</text><text x="167" y="722" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">권한 검사와 필요한 승인</text><text x="167" y="765" font-size="24" font-weight="400" fill="#DFE9F0" text-anchor="start">사용자 · 대상 · 도구 · 실제 입력값 검증</text><text x="167" y="803" font-size="24" font-weight="400" fill="#DFE9F0" text-anchor="start">중요 작업은 담당자가 승인</text><path d="M105 863 L105 916" fill="none" stroke="#087F8C" stroke-width="2.5" marker-end="url(#arrow)"/><g transform="translate(84.0 938.0) scale(1.05)" fill="none" stroke="#152C43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m26 3-6 6 3 8 8 3 6-6c2 10-5 18-15 14L11 39l-9-9 11-11C9 9 16 1 26 3Z"/><path d="m8 30 3 3"/></g><text x="167" y="934" font-size="20" font-weight="700" fill="#087F8C" text-anchor="start">04</text><text x="167" y="977" font-size="30" font-weight="700" fill="#152C43" text-anchor="start">제한된 도구 실행</text><text x="167" y="1017" font-size="24" font-weight="400" fill="#607285" text-anchor="start">허용 API · 최소 권한 · 비용·시간 상한</text><text x="167" y="1052" font-size="23" font-weight="400" fill="#607285" text-anchor="start">실행 직전에도 취소 여부와 권한을 확인</text><path d="M105 992 L105 1112" fill="none" stroke="#087F8C" stroke-width="2.5" marker-end="url(#arrow)"/><g transform="translate(84.0 1129.0) scale(1.05)" fill="none" stroke="#152C43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="4" width="27" height="32" rx="3"/><path d="m13 14 3 3 5-6M24 14h5m-16 12 3 3 5-6M24 26h5"/></g><text x="167" y="1126" font-size="20" font-weight="700" fill="#087F8C" text-anchor="start">05</text><text x="167" y="1169" font-size="30" font-weight="700" fill="#152C43" text-anchor="start">실제 결과 확인과 기록</text><text x="167" y="1210" font-size="24" font-weight="400" fill="#607285" text-anchor="start">성공·실패·변경 내역 확인, 보호된 로그로 탐지</text><rect x="856" y="640" width="296" height="570" rx="8" fill="#FBF4E8" stroke="none" stroke-width="1.5"/><g transform="translate(882.0 670.0) scale(0.8)" fill="none" stroke="#B87916" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="20" r="17"/><rect x="13" y="13" width="14" height="14" rx="1"/></g><text x="929" y="694" font-size="27" font-weight="700" fill="#B87916" text-anchor="start">취소 신호</text><path d="M880 722 L1128 722" fill="none" stroke="#E1CCA5" stroke-width="1.5"/><path d="M883 756 L883 939" fill="none" stroke="#CFAC71" stroke-width="2"/><circle cx="883" cy="762" r="4.5" fill="#B87916"/><text x="906" y="771" font-size="24" font-weight="700" fill="#152C43" text-anchor="start">대기 작업 중단</text><circle cx="883" cy="840" r="4.5" fill="#B87916"/><text x="906" y="849" font-size="24" font-weight="700" fill="#152C43" text-anchor="start">실행 자격 회수</text><circle cx="883" cy="918" r="4.5" fill="#B87916"/><text x="906" y="927" font-size="24" font-weight="700" fill="#152C43" text-anchor="start">신규 호출 차단</text><path d="M855 885 L126 885" fill="none" stroke="#B87916" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#amber-arrow)"/><rect x="404" y="866" width="207" height="34" rx="0" fill="#FBFCFD" stroke="none" stroke-width="1.5"/><text x="507.5" y="890" font-size="21" font-weight="700" fill="#B87916" text-anchor="middle">실행 전에 재확인</text><path d="M880 980 L1128 980" fill="none" stroke="#E1CCA5" stroke-width="1.5"/><text x="881" y="1026" font-size="23" font-weight="700" fill="#152C43" text-anchor="start">이미 실행된 변경은</text><text x="881" y="1063" font-size="23" font-weight="700" fill="#152C43" text-anchor="start">별도 복구 절차</text><text x="881" y="1121" font-size="21" font-weight="400" fill="#607285" text-anchor="start">화면의 취소 표시만으로</text><text x="881" y="1153" font-size="21" font-weight="400" fill="#607285" text-anchor="start">작업이 멈추지는 않습니다.</text><path d="M48 1254 L1152 1254" fill="none" stroke="#D8E2E9" stroke-width="1.5"/><text x="48" y="1297" font-size="22" font-weight="400" fill="#607285" text-anchor="start">화살표는 작업 처리 순서입니다. 거부·실패·취소 시 다음 실행 단계로 진행하지 않습니다.</text><text x="48" y="1332" font-size="22" font-weight="400" fill="#607285" text-anchor="start">모델의 ‘승인됨’이라는 답변은 승인 근거가 아닙니다. 실제 시스템의 결과를 확인합니다.</text>
  </g>
</svg>
